name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RuleEngine.sln

      - name: Build
        run: dotnet build RuleEngine.sln --no-restore -c Release

      - name: Test
        run: >
          dotnet test RuleEngine.sln --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFilePrefix=results"

      # Merge the unit + integration Cobertura reports and print one coverage figure for the whole solution.
      - name: Coverage summary
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.12 --tool-path ./.tools
          ./.tools/reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"TextSummary;MarkdownSummaryGithub"
          cat coverage-report/Summary.txt
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t ai-rule-engine:${{ github.sha }} .
